<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Treino Lombar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: app de uma coluna, abas de dia fixas no topo, cards de exercício empilhados */
  --bg:#12151a;
  --surface:#1b2028;
  --line:#2a313c;
  --ink:#eef1f5;
  --muted:#8b95a5;
  --accent:#ff8a3d;
  --ok:#3ecf8e;
  --warn:#f5c443;
  --bad:#ff5d5d;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.5px;text-transform:uppercase}
h1 span{color:var(--accent)}
.phase{display:flex;background:var(--surface);border-radius:10px;padding:3px;gap:2px}
.phase button{font-family:var(--display);font-weight:700;font-size:15px;padding:6px 10px;border-radius:8px;color:var(--muted);line-height:1}
.phase button small{display:block;font-family:var(--body);font-weight:500;font-size:10px;margin-top:2px}
.phase button[aria-pressed="true"]{background:var(--accent);color:#1a1006}
.days{display:flex;gap:6px;overflow-x:auto;padding:12px 0 12px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:0 0 auto;min-width:48px;padding:8px 10px;border-radius:12px;background:var(--surface);font-family:var(--display);font-weight:700;font-size:16px;text-transform:uppercase;color:var(--muted);position:relative}
.days button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.days button.today::after{content:"";position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}

main{padding:16px;display:grid;gap:14px;max-width:560px;margin:0 auto}
.dayhead{display:grid;gap:8px}
.dayhead h2{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;text-transform:uppercase;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface);color:var(--muted)}
.tag.acc{background:rgba(255,138,61,.15);color:var(--accent)}
.prog{height:6px;background:var(--surface);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

.block{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-top:6px}

.card{background:var(--surface);border-radius:18px;overflow:hidden;border:1px solid var(--line);transition:opacity .2s}
.card.done{opacity:.5}
.fig{background:#0e1115;aspect-ratio:16/9;display:block;width:100%}
.fig svg{display:block;width:100%;height:100%}
.cb{padding:12px 14px 14px;display:grid;gap:10px}
.row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.num{font-family:var(--display);font-weight:700;color:var(--accent);font-size:15px}
.name{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.05;text-transform:uppercase}
.check{flex:0 0 auto;width:40px;height:40px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center}
.check svg{width:20px;height:20px;opacity:0}
.card.done .check{background:var(--ok);border-color:var(--ok)}
.card.done .check svg{opacity:1}
.dose{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:6px 10px;border-radius:12px;background:var(--bg)}
.pill b{font-family:var(--display);font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.pill small{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.pill.note{justify-content:center;background:rgba(255,138,61,.12)}
.pill.note b{font-size:15px;color:var(--accent);font-family:var(--body);font-weight:700}
.tip{font-size:15px;line-height:1.35;color:var(--ink);display:flex;gap:8px}
.tip::before{content:"";flex:0 0 4px;border-radius:2px;background:var(--accent)}
.timer{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;border-radius:12px;background:var(--bg);font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.5px;text-transform:uppercase}
.timer.run{background:var(--accent);color:#1a1006}

.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:12px 14px;border-top:1px solid var(--line);font-size:15px;line-height:1.35}
.li:first-child{border-top:0}
.li b{font-family:var(--display);font-size:17px;text-transform:uppercase;color:var(--accent);line-height:1.2}
.sem{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);font-size:15px;line-height:1.3}
.sem:first-child{border-top:0}
.dot{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;color:#111}
.alert{background:rgba(255,93,93,.1);border:1px solid rgba(255,93,93,.4);border-radius:18px;padding:14px;display:grid;gap:8px;font-size:15px;line-height:1.35}
.alert b{font-family:var(--display);font-size:18px;text-transform:uppercase;color:var(--bad)}
.alert ul{padding-left:18px;display:grid;gap:4px}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Lombar <span>L5-S1</span></h1>
    <div class="phase" role="group" aria-label="Fase">
      <button id="ph0" data-p="0">F1<small>sem 1-4</small></button>
      <button id="ph1" data-p="1">F2<small>sem 5-8</small></button>
      <button id="ph2" data-p="2">F3<small>sem 9-12</small></button>
    </div>
  </div>
  <nav class="days" role="tablist" id="days"></nav>
</header>
<main id="main"></main>

<script>

  farmer:[{f1:[92,112],k1:[96,87],f2:[110,112],k2:[105,87],p:[100,62],s:[100,24],h:[100,12],e1:[103,44],w1:[103,64],e2:[97,44],w2:[97,64],props:[[96,70,110,70,8,"acc"],[90,71,104,71,8,"acc"]]},

  n9090:[{p:[100,104],s:[100,66],h:[100,54],k1:[128,96],f1:[120,110],k2:[124,101],f2:[106,109],e1:[106,84],w1:[112,100],e2:[94,84],w2:[88,100]},

  afundo:[{k1:[78,111],f1:[50,111],k2:[128,84],f2:[130,112],p:[95,84],s:[97,46],h:[98,34],e1:[110,62],w1:[98,80],e2:[112,64],w2:[100,82]},

  rotacao:[P(Q,{e1:[122,90],w1:[134,72],e2:[131,90],w2:[131,109]}),P(Q,{e1:[120,44],w1:[133,58],h:[141,58],e2:[131,90],w2:[131,109]})],
  extensao:[{f1:[28,106],k1:[58,106],f2:[31,107],k2:[61,107],p:[92,106],s:[140,106],h:[156,103],e1:[138,109],w1:[158,109],e2:[141,109],w2:[161,109]},

};
const lerp=(a,b,t)=>a+(b-a)*t;
function mix(A,B,t){
  const o={};
  for(const k in A){
    if(k==="props") o.props=A.props.map((pa,i)=>pa.map((v,j)=>typeof v==="number"?lerp(v,B.props[i][j],t):v));
    else o[k]=[lerp(A[k][0],B[k][0],t),lerp(A[k][1],B[k][1],t)];
  }
  if(!o.c) o.c=[(o.s[0]+o.p[0])/2,(o.s[1]+o.p[1])/2];
  return o;
}
function svgPose(f){
  const L=(a,b,c,cls)=>`<path class="${cls}" d="M${a[0]} ${a[1]}L${b[0]} ${b[1]}L${c[0]} ${c[1]}"/>`;
  let props=(f.props||[]).map(p=>`<line x1="${p[0]}" y1="${p[1]}" x2="${p[2]}" y2="${p[3]}" stroke-width="${p[4]}" class="pr-${p[5]}"/>`).join("");
  return `${L(f.p,f.k2,f.f2,"far")}${L(f.s,f.e2,f.w2,"far")}`+
    `<path class="near" d="M${f.s[0]} ${f.s[1]}Q${f.c[0]} ${f.c[1]} ${f.p[0]} ${f.p[1]}"/>`+
    `${L(f.p,f.k1,f.f1,"near")}${props}${L(f.s,f.e1,f.w1,"near")}<circle cx="${f.h[0]}" cy="${f.h[1]}" r="8" class="head"/>`;
}
const SVGSTYLE=`<style>.near{stroke:#eef1f5;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}.far{stroke:#6b7686;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}.head{fill:#eef1f5}.pr-acc{stroke:#ff8a3d;stroke-linecap:round}.pr-m{stroke:#4a5462;stroke-linecap:round}.floor{stroke:#2a313c;stroke-width:2}</style>`;
function figure(key){
  const [A,B]=POSES[key];let x0=999,y0=999,x1=-999,y1=114;
  [A,B].forEach(P=>{for(const k in P){if(k==="props")P.props.forEach(q=>{x0=Math.min(x0,q[0],q[2]);x1=Math.max(x1,q[0],q[2]);y0=Math.min(y0,q[1],q[3])});else{x0=Math.min(x0,P[k][0]);x1=Math.max(x1,P[k][0]);y0=Math.min(y0,P[k][1])}}});
  const pad=14,w=Math.max(x1-x0+2*pad,(y1-y0+2*pad)*16/9),h=w*9/16,cx=(x0+x1)/2,vy=Math.min(y0-pad,y1+6-h);
  return `<svg viewBox="${cx-w/2} ${vy} ${w} ${h}" preserveAspectRatio="xMidYMid meet" data-pose="${key}" aria-hidden="true">${SVGSTYLE}<line class="floor" x1="-200" y1="114" x2="400" y2="114"/><g></g></svg>`;
}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function ease(ms){
  const T=3200,x=(ms%T)/T;
  if(x<.2) return 0; if(x<.45) return (1-Math.cos(Math.PI*(x-.2)/.25))/2;
  if(x<.7) return 1; if(x<.95) return 1-(1-Math.cos(Math.PI*(x-.7)/.25))/2; return 0;
}
function tick(ms){
  const t=reduce?1:ease(ms);
  document.querySelectorAll("svg[data-pose]").forEach(s=>{
    const [A,B]=POSES[s.dataset.pose]; s.lastChild.innerHTML=svgPose(mix(A,B,t));
  });
  if(!reduce) requestAnimationFrame(tick);
}

  n9090:{nome:"90/90 de quadril",pose:"n9090",dica:"Sentado, joelhos dobrados. Troca os joelhos de lado devagar.",dose:[{r:6,l:1,n:"trocas"},{r:6,l:1,n:"trocas"},{r:8,l:1,n:"trocas"}]},
  afundo:{nome:"Alongamento do quadril",pose:"afundo",dica:"Um joelho no chão. Aperta o glúteo de trás e leva o quadril à frente.",dose:[{s:2,h:30,l:1},{s:2,h:30,l:1},{s:2,h:45,l:1}]},
  rotacao:{nome:"Rotação torácica",pose:"rotacao",dica:"Quatro apoios, mão na cabeça. Gira o peito, o quadril fica parado.",dose:[{r:8,l:1},{r:8,l:1},{r:10,l:1}]},
  extensao:{nome:"Extensão de bruços",pose:"extensao",dica:"Quadril no chão, sobe o tronco nos antebraços. Só faça se aliviar.",dose:[{r:10,n:"lento"},{r:10,n:"lento"},{r:10,n:"lento"}]},
  posterior:{nome:"Alongamento posterior",pose:"posterior",dica:"Deitado, faixa no pé. Perna esticada, lombar no chão.",dose:[{s:2,h:30,l:1},{s:2,h:30,l:1},{s:2,h:30,l:1}]},
  caminhada:{nome:"Caminhada",pose:"caminhada",dica:"Ritmo confortável, braços soltos.",dose:null},
  corrida:{nome:"Corrida leve",pose:"corrida",dica:"Dá para conversar correndo. Se doer mais no dia seguinte, reduz.",dose:null}
};
const cardio=(id,t)=>({id,t});
const A=["curlup","prancha","perdigueiro","ponte"];
const B=["hinge","agacha","ponteuni","concha","deadbug","farmer"];
const M=["n9090","afundo","rotacao","extensao","posterior"];
const RUN=["20 a 30 min","até 40 min","volume normal"];
const DAYS=[
  {id:"seg",curto:"Seg",nome:"Segunda",titulo:"Treino A · Estabilização",min:"25 min",blocos:[["Aquecer",["gato"]],["Treino",A],["Final",[cardio("caminhada",()=>"20 min")]]]},
  {id:"ter",curto:"Ter",nome:"Terça",titulo:"Mobilidade + corrida",min:"15 min",blocos:[["Mobilidade",M],["Cardio",[cardio("corrida",p=>RUN[p])]]]},
  {id:"qua",curto:"Qua",nome:"Quarta",titulo:"Treino B · Quadril",min:"30 min",blocos:[["Aquecer",["gato"]],["Treino",B],["Final",[cardio("caminhada",()=>"20 min")]]]},
  {id:"qui",curto:"Qui",nome:"Quinta",titulo:"Mobilidade + caminhada",min:"15 min",blocos:[["Mobilidade",M],["Cardio",[cardio("caminhada",()=>"30 a 40 min")]]]},
  {id:"sex",curto:"Sex",nome:"Sexta",titulo:"Treino A · Estabilização",min:"25 min",blocos:[["Aquecer",["gato"]],["Treino",A],["Final",[cardio("caminhada",()=>"20 min")]]]},
  {id:"sab",curto:"Sáb",nome:"Sábado",titulo:"Mobilidade + corrida",min:"15 min",blocos:[["Mobilidade",M],["Cardio",[cardio("corrida",p=>["20 a 40 min","até 40 min","volume normal"][p])]]]},
  {id:"dom",curto:"Dom",nome:"Domingo",titulo:"Descanso ativo",min:"livre",blocos:[["Só isso",[cardio("caminhada",()=>"30 min leve")]]]},
  {id:"dia",curto:"Todo dia",nome:"Todo dia",info:true}
];

/* ---------- Estado ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const todayIdx=(new Date().getDay()+6)%7;
let phase=store.get("lombar-fase",0);
let day=todayIdx;
const dateKey=new Date().toISOString().slice(0,10);
let done=store.get("lombar-feito-"+dateKey,{});

/* ---------- Render ---------- */
function pills(d){
  const out=[];
  if(d.s) out.push([d.s,"séries"]);
  if(d.r) out.push([d.r,"reps"]);
  if(d.d) out.push([d.d,"distância"]);
  if(d.h) out.push([d.h+"s",d.r?"segura cada":"segura"]);
  let h=out.map(([b,s])=>`<div class="pill"><b>${b}</b><small>${s}</small></div>`).join("");
  if(d.l) h+=`<div class="pill note"><b>cada lado</b></div>`;
  if(d.n) h+=`<div class="pill note"><b>${d.n}</b></div>`;
  return h;
}
function card(item,i,dayId){
  const isCardio=typeof item==="object";
  const id=isCardio?item.id:item, ex=EX[id];
  const key=dayId+"-"+i;
  let dose, timerS=0;
  if(isCardio){dose=`<div class="pill"><b>${item.t(phase)}</b><small>tempo</small></div>`}
  else{const d=ex.dose[phase];dose=pills(d);timerS=d.h&&d.h>=10?d.h:0}
  return `<article class="card${done[key]?" done":""}" data-key="${key}">
    <div class="fig">${figure(ex.pose)}</div>
    <div class="cb">
      <div class="row"><div><div class="num">${String(i+1).padStart(2,"0")}</div><div class="name">${ex.nome}</div></div>
        <button class="check" aria-label="Marcar ${ex.nome} como feito"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
      <div class="dose">${dose}</div>
      <div class="tip">${ex.dica}</div>
      ${timerS?`<button class="timer" data-s="${timerS}">▶ Cronômetro ${timerS}s</button>`:""}
    </div></article>`;
}
function infoView(){
  const hab=[["Ao acordar","Gato-camelo leve, 6 vezes. Nada de pegar peso do chão na 1ª hora."],["Banheiro","Banquinho sob os pés. Tronco ereto, sem celular."],["Sentado","Toalha enrolada na lombar. Levanta a cada 30 a 40 min."],["Pausa","Em pé, mãos na cintura, inclina para trás 10 vezes."],["Almoço","Caminhada de 10 a 15 min."],["Pegar do chão","Dobra quadril e joelhos, costas retas."],["Antes de dormir","90/90 de quadril e 1 série de perdigueiro."],["Dormir","De lado com travesseiro entre os joelhos."]];
  return `<section class="dayhead"><h2>Todo dia</h2><div class="meta"><span class="tag acc">Hábitos</span><span class="tag">Semáforo da dor</span></div></section>
  <div class="block">Hábitos</div>
  <div class="list">${hab.map(([a,b])=>`<div class="li"><b>${a}</b><span>${b}</span></div>`).join("")}</div>
  <div class="block">Semáforo da dor (0 a 10)</div>
  <div class="list">
    <div class="sem"><div class="dot" style="background:var(--ok)">0-3</div><span>Segue o plano.</span></div>
    <div class="sem"><div class="dot" style="background:var(--warn)">4-5</div><span>Repete a semana com metade do volume. Não avança de fase.</span></div>
    <div class="sem"><div class="dot" style="background:var(--bad)">6+</div><span>Para o treino, só caminhada, e fala com o médico.</span></div>
  </div>
  <div class="block">Não fazer nas fases 1 e 2</div>
  <div class="list">
    <div class="li"><b>Abdominal</b><span>Abdominal comum e máquina de abdominal.</span></div>
    <div class="li"><b>Alongar</b><span>Tocar os pés com as costas arredondadas.</span></div>
    <div class="li"><b>Academia</b><span>Leg press fundo, remada curvada pesada, girar o tronco com peso.</span></div>
  </div>
  <div class="alert"><b>Procure o médico já se tiver</b><ul><li>Fraqueza na perna ou pé caindo</li><li>Dormência na região genital ou parte interna das coxas</li><li>Alteração para urinar ou evacuar</li><li>Febre ou dor noturna que não alivia</li></ul></div>`;
}
function render(){
  document.querySelectorAll(".phase button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.p===phase)));
  document.querySelectorAll("#days button").forEach((b,i)=>b.setAttribute("aria-selected",String(i===day)));
  const D=DAYS[day], main=document.getElementById("main");
  if(D.info){main.innerHTML=infoView();return}
  let i=0,html="",total=0;
  D.blocos.forEach(([nome,itens])=>{html+=`<div class="block">${nome}</div>`;itens.forEach(it=>{html+=card(it,i,D.id);i++;total++})});
  const feitos=Object.keys(done).filter(k=>k.startsWith(D.id+"-")&&done[k]).length;
  main.innerHTML=`<section class="dayhead"><h2>${D.nome}</h2>
    <div class="meta"><span class="tag acc">${D.titulo}</span><span class="tag">${D.min}</span><span class="tag" id="cnt">${feitos}/${total} feitos</span></div>
    <div class="prog"><i id="bar" style="width:${total?feitos/total*100:0}%"></i></div></section>${html}`;
  main.dataset.total=total;
}
function updateProgress(){
  const D=DAYS[day],total=+document.getElementById("main").dataset.total;
  const f=Object.keys(done).filter(k=>k.startsWith(D.id+"-")&&done[k]).length;
  document.getElementById("cnt").textContent=`${f}/${total} feitos`;
  document.getElementById("bar").style.width=(f/total*100)+"%";
}

/* ---------- Eventos ---------- */
document.getElementById("days").innerHTML=DAYS.map((d,i)=>`<button role="tab" id="tab-${d.id}" class="${i===todayIdx?"today":""}">${d.curto}</button>`).join("");
document.getElementById("days").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;day=[...b.parentNode.children].indexOf(b);render();window.scrollTo({top:0})});
document.querySelector(".phase").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;phase=+b.dataset.p;store.set("lombar-fase",phase);render()});
let tmr=null;
document.getElementById("main").addEventListener("click",e=>{
  const c=e.target.closest(".check");
  if(c){const card=c.closest(".card"),k=card.dataset.key;done[k]=!done[k];store.set("lombar-feito-"+dateKey,done);card.classList.toggle("done",done[k]);updateProgress();return}
  const t=e.target.closest(".timer");
  if(t){
    if(tmr){clearInterval(tmr.id);tmr.el.classList.remove("run");tmr.el.textContent=`▶ Cronômetro ${tmr.el.dataset.s}s`;const same=tmr.el===t;tmr=null;if(same)return}
    let left=+t.dataset.s;t.classList.add("run");t.textContent=`${left}s · toque para parar`;
    tmr={el:t,id:setInterval(()=>{left--;if(left<=0){clearInterval(tmr.id);t.classList.remove("run");t.textContent="✓ Pronto · de novo";try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(err){}tmr=null}else t.textContent=`${left}s · toque para parar`},1000)};
  }
});
render();
requestAnimationFrame(tick);
</script>
</body>
</html>
